      S.dupTag.firstChild.textContent = 'DUPLICATE ×2'; setCenter(S.dupTag, W / 2, H * 0.72);
    } else if (τ < cuts[4]) { // loading dock: boxes piling up
      const p = seg(τ, cuts[3], cuts[4]); shake = [Math.sin(t * 33) * U * 0.7, Math.cos(t * 27) * U * 0.6];
      fillBg('#191712', '#0c0b09');
      ctx.fillStyle = '#2a2720'; ctx.fillRect(0, H * 0.7, W, H * 0.3);
      for (let i = 0; i < 46; i++) {
        const col = i % 9, row = Math.floor(i / 9), drop = clamp(p * 1.6 - row * 0.22);
        const x = W * 0.1 + col * W * 0.1 + (row % 2) * W * 0.05, yT = H * 0.66 - row * U * 8.4;
        if (drop > 0) isoBox(x, lerp(-U * 20, yT, eout(drop)), U * 9, 1, 0.9, false);
      }
    } else { // the old model, struck through
      const p = seg(τ, cuts[4], D);
      shelves(t, 11, 0.5, false, { z: 2.4 + p * 0.4, x: 0, y: 0, f: V ? 42 : 60 });
      ctx.fillStyle = 'rgba(8,8,6,.55)'; ctx.fillRect(0, 0, W, H);
      show(['guess']); setCenter(S.guess, W / 2, H * 0.48, `scale(${1 + p * 0.03})`, seg(p, 0, 0.12));
      [...S.guess.querySelectorAll('.strike')].forEach((st, i) => { const sp = eexp(seg(τ, cuts[4] + 0.45 + i * 0.14, cuts[4] + 0.75 + i * 0.14)); st.style.transform = `translateY(-50%) scaleX(${sp}) rotate(-3deg)`; });
    }
    $('vignette').style.opacity = 1.2;
  }

  if (inShot(t, 's3')) {
    const { τ, D } = local(t, 's3');
    const toWhite = eio(seg(τ, 0.05, 0.9));
    const c1 = [21, 20, 15], c2 = [236, 239, 244];
    const mix = (a, b) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], toWhite))).join(',')})`;
    fillBg(mix(c1, [246, 247, 250]), mix([11, 10, 8], c2));
    if (τ < 0.1) { shelves(t, 11, 0.5, false, { z: 2.8, x: 0, y: 0, f: V ? 42 : 60 }); $('flash').style.opacity = 0.35; }
    shards(t, seg(τ, 0.05, 1.3));
    const sp = seg(τ, 0.55, 1.35); if (sp > 0 && sp < 1) streaks(sp, W / 2, H * 0.47);
    const lp = eback(seg(τ, 1.1, 1.7));
    show(['logo3']); setCenter(S.logo3, W / 2, H * 0.47, `scale(${0.7 + lp * 0.3})`, seg(τ, 1.1, 1.4));
    S.logo3.style.filter = `blur(${(1 - seg(τ, 1.1, 1.6)) * U * 1.2}px)`;
    $('flash').style.opacity = Math.max(+$('flash').style.opacity, (1 - seg(τ, 1.25, 1.7)) * seg(τ, 1.05, 1.25) * 0.8);
    $('vignette').style.opacity = 0.25;
  }

  if (inShot(t, 's4')) {
    const { τ, D } = local(t, 's4');
    fillBg('#14112a', '#07060f');
    const g = ctx.createRadialGradient(W / 2, H * 0.45, 0, W / 2, H * 0.45, U * 70); g.addColorStop(0, 'rgba(94,234,212,.18)'); g.addColorStop(1, 'rgba(94,234,212,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    show(['phone']);
    const zoom = eio(seg(τ, 0.72, 1.05));
    const tilt = (1 - seg(τ, 0, 0.6)) * 14;
    const shakeWin = τ > D - 0.72 ? Math.sin(τ * 70) * U * 0.9 * (1 - seg(τ, D - 0.72, D - 0.3)) : 0;
    S.phone.style.transform = `translate(-50%,-50%) translateX(${shakeWin}px) perspective(${U * 200}px) rotateX(${tilt}deg) scale(${1 + zoom * (V ? 0.5 : 0.1)})`;
    const shot = $('shot'); shot.style.transform = `translateY(${-seg(τ, 0.1, 0.55) * 8}%)`;
    const tap = $('tap'); const tp = seg(τ, 0.52, 0.8);
    tap.style.opacity = tp > 0 && tp < 1 ? 1 - tp : 0; tap.style.transform = `scale(${0.5 + tp})`; tap.style.left = '50%'; tap.style.top = '84%';
    const gameOn = τ >= 0.85, win = τ >= D - 0.75;
    $('game').classList.toggle('hide', !gameOn || win); shot.classList.toggle('hide', gameOn);
    $('win').classList.toggle('hide', !win);
    if (gameOn && !win) {
      const gt = τ - 0.85, beat = 60 / 116;
      const lanes = [1, 0, 2, 1, 2, 0, 1];
      const k = Math.floor(gt / beat), fr = (gt % beat) / beat;
      const cur = lanes[k % lanes.length], nxt = lanes[(k + 1) % lanes.length];
      $('runner').style.left = (16.6 + lerp(cur, nxt, eio(clamp((fr - 0.55) * 3))) * 33.3) + '%';
      $('score').textContent = Math.min(15, 6 + k);
      $('frags').innerHTML = [0, 1, 2].map((j) => { const ln = lanes[(k + j) % lanes.length]; const y = (fr + j) / 3 * 88; return `<div class="frag" style="left:${16.6 + ln * 33.3}%;top:${y}%"></div>`; }).join('');
    }
    if (win) {
      const wp = seg(τ, D - 0.75, D - 0.35);
      $('win').style.transform = `scale(${0.6 + eback(wp) * 0.4})`;
      $('win').style.background = `radial-gradient(circle, rgba(255,216,77,${0.55 * (1 - wp * 0.5)}), rgba(20,17,42,.2) 70%)`;
      $('flash').style.opacity = (1 - seg(τ, D - 0.75, D - 0.55)) * 0.45;
    }
  }

  if (inShot(t, 's5a')) {
    const { τ, D } = local(t, 's5a');
    fillBg('#020506', '#050a0c');
    spotlight(W / 2, 1);
    const bs = $('boxScene'), cube = $('cube');
    const explode = 1.0;
    if (τ < explode + 0.05) {
      bs.style.display = 'block';
      const s = U * 30; cube.style.setProperty('--s', s);
      const sh = seg(τ, 0.2, explode) ** 2 * U * 1.6;
      bs.style.transform = `translate(-50%,-50%) translate(${Math.sin(τ * 60) * sh}px,${Math.cos(τ * 53) * sh + Math.sin(τ * 2) * U}px)`;
      cube.style.transform = `rotateX(-14deg) rotateY(${-24 + Math.sin(τ * 3) * 6}deg)`;
      const cp = seg(τ, 0.45, explode);
      if (cp > 0) $('crack').innerHTML = `<path d="M50 0 L46 22 L55 38 L44 55 L52 72 L47 100" stroke="#fff4cc" stroke-width="${1 + cp * 2}" fill="none" stroke-dasharray="120" stroke-dashoffset="${120 - cp * 120}" style="filter:drop-shadow(0 0 3px #ffd84d)"/><path d="M0 40 L20 44 L34 36 L46 22" stroke="#fff4cc" stroke-width="${cp * 1.6}" fill="none" stroke-dasharray="60" stroke-dashoffset="${60 - cp * 60}"/><path d="M100 64 L78 60 L64 70 L52 72" stroke="#fff4cc" stroke-width="${cp * 1.6}" fill="none" stroke-dasharray="60" stroke-dashoffset="${60 - cp * 60}"/>`;
      const glow = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, U * 30 * (0.5 + cp)); glow.addColorStop(0, `rgba(255,216,77,${0.4 * cp})`); glow.addColorStop(1, 'rgba(255,216,77,0)'); ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
    }
    // explosion: slow-motion gold foil and panel shards
    confetti(explode, t - TL.shots.s5a[0], W / 2, H * 0.48, 220, ['#ffd84d', '#fff4cc', '#e0b04e', '#ffffff', '#b8862b'], 2.1, 1);
    if (τ >= explode) {
      for (let i = 0; i < 6; i++) { // box faces flying apart
        const p = seg(τ, explode, explode + 1.8), ang = (i / 6) * Math.PI * 2 + 0.4;
        ctx.save(); ctx.globalAlpha = 1 - p; ctx.translate(W / 2 + Math.cos(ang) * U * 55 * eout(p), H * 0.48 + Math.sin(ang) * U * 55 * eout(p)); ctx.rotate(p * (i % 2 ? 2 : -2));
        ctx.fillStyle = '#121217'; ctx.strokeStyle = 'rgba(255,216,77,.6)'; ctx.lineWidth = 2; ctx.fillRect(-U * 9, -U * 9, U * 18, U * 18); ctx.strokeRect(-U * 9, -U * 9, U * 18, U * 18); ctx.restore();
      }
      $('flash').style.opacity = (1 - seg(τ, explode, explode + 0.35)) * 0.7;
      const rise = eout(seg(τ, explode + 0.1, explode + 1.1));
      const ring = ctx.createRadialGradient(W / 2, H * 0.44, 0, W / 2, H * 0.44, U * 36); ring.addColorStop(0, `rgba(255,216,77,${0.5 * rise})`); ring.addColorStop(0.55, `rgba(255,216,77,${0.16 * rise})`); ring.addColorStop(1, 'rgba(255,216,77,0)'); ctx.fillStyle = ring; ctx.fillRect(0, 0, W, H);
      show(['hero', 'heroCopy']);
      const size = U * (V ? 58 : 50);
      place(S.hero, W / 2, H * (V ? 0.42 : 0.4) + (1 - rise) * U * 30, size, size * 1.03, `perspective(${U * 160}px) rotateY(${Math.sin((τ - explode) * 1.6) * 26}deg) scale(${0.7 + rise * 0.3})`);
      S.hero.style.opacity = rise;
      S.heroCopy.style.top = (V ? H * 0.66 : H * 0.7) + 'px';
      S.heroCopy.style.opacity = seg(τ, explode + 0.8, explode + 1.2);
      S.heroCopy.querySelector('.draw').style.opacity = seg(τ, explode + 1.3, explode + 1.6);
      $('flare').style.opacity = 0.7 * rise; $('flare').style.top = H * 0.44 + 'px';
    }
  }

  if (inShot(t, 's5b')) {
    const { τ, D } = local(t, 's5b');
    fillBg('#14112a', '#07060f');
    const toTrade = 1.45;
    if (τ < toTrade) {
      show(['coll']);
      const inP = eout(seg(τ, 0, 0.35));
      setCenter(S.coll, W / 2, H / 2 + (1 - inP) * U * 10, `scale(${V ? 1 : 0.82})`, inP);
      const tap = $('tap2'), tp = seg(τ, 0.8, 1.1), btn = $('findbtn');
      tap.style.opacity = tp > 0 && tp < 1 ? 1 - tp : 0; tap.style.left = '50%'; tap.style.top = 'calc(100% - var(--u) * 7)'; tap.style.transform = `scale(${0.5 + tp})`;
      btn.style.transform = `scale(${1 - Math.sin(Math.PI * tp) * 0.06})`;
      for (const c of S.coll.querySelectorAll('.card.dup')) c.style.opacity = 0.75 + Math.sin(τ * 9) * 0.25;
    } else {
      const tt = τ - toTrade, snap = 0.75;
      show(['tA', 'tB', 'swap', 'match']);
      const p = seg(tt, 0, snap), e = p < 1 ? eio(p) : 1, over = tt > snap ? Math.sin(seg(tt, snap, snap + 0.3) * Math.PI) * U * 1.2 : 0;
      const gap = V ? U * 21.5 : U * 24, off = (1 - e) * W * 0.32;
      const cy = H * (V ? 0.45 : 0.47);
      setCenter(S.tA, W / 2 - gap - off + over, cy, '', 1);
      setCenter(S.tB, W / 2 + gap + off - over, cy, '', 1);
      setCenter(S.swap, W / 2, V ? H * 0.27 : H * 0.16, '', seg(tt, snap, snap + 0.2));
      const mp = seg(tt, snap + 0.45, snap + 0.8);
      setCenter(S.match, W / 2, V ? H * 0.68 : H * 0.84, `scale(${0.6 + eback(mp) * 0.4})`, mp);
      confetti(snap + 0.45, tt, W / 2, cy, 160, ['#5eead4', '#ffd84d', '#ffffff', '#8c7bff'], 1, 1.1);
      if (tt > snap && tt < snap + 0.12) $('flash').style.opacity = 0.35;
    }
  }

  if (inShot(t, 's6')) {
    const { τ, D } = local(t, 's6');
    const pull = eio(seg(τ, 0, 0.8));
    studioFloor(0.6 + pull * 0.6);
    for (let i = 0; i < 5; i++) { const x = W * (0.1 + i * 0.2); ctx.fillStyle = `rgba(94,234,212,${0.05 + 0.03 * Math.sin(i)})`; ctx.fillRect(x - U * 4, H * 0.08, U * 8, H * 0.5); }
    const fly = eio(seg(τ, 1.45, 1.95));
    const pcx = V ? W / 2 : W * 0.66, pcy = V ? H * 0.64 : H * 0.55;
    show(['manifest', 'printer']);
    const mcx = V ? W / 2 : W * 0.3, mcy = V ? H * 0.28 : H * 0.48;
    setCenter(S.manifest, lerp(mcx, pcx, fly), lerp(mcy, pcy - U * 10, fly), `scale(${(0.85 + pull * 0.15) * (1 - fly * 0.9)})`, seg(τ, 0.1, 0.45) * (1 - seg(τ, 1.8, 1.95)));
    [...S.manifest.querySelectorAll('b')].forEach((b, i) => { const q = +b.dataset.q; b.textContent = '×' + Math.round(q * eout(seg(τ, 0.35 + i * 0.12, 1.1 + i * 0.12))); });
    // printer
    const pw = U * (V ? 44 : 40), ph = U * (V ? 46 : 44);
    const pr = S.printer; pr.style.left = pcx + 'px'; pr.style.top = pcy + 'px';
    const fr = $('pframe'); fr.style.left = -pw / 2 + 'px'; fr.style.top = -ph / 2 + 'px'; fr.style.width = pw + 'px'; fr.style.height = ph + 'px';
    const bed = $('pbed'); bed.style.left = -pw * 0.42 + 'px'; bed.style.width = pw * 0.84 + 'px'; bed.style.top = ph * 0.38 + 'px';
    const on = seg(τ, 1.85, 2.0);
    fr.style.boxShadow = `0 0 ${U * 6 * on}px rgba(94,234,212,${0.5 * on})`;
    const build = seg(τ, 1.95, D - 0.05);
    const kh = ph * 0.62, kw = kh * 0.97, kTop = ph * 0.38 - kh;
    const kin = $('pkin'); kin.style.left = -kw / 2 + 'px'; kin.style.top = kTop + 'px'; kin.style.width = kw + 'px'; kin.style.height = kh + 'px';
    kin.style.clipPath = `inset(${(1 - build) * 100}% 0 0 0)`;
    const lineY = kTop + kh * (1 - build);
    const gan = $('pgantry'); gan.style.left = -pw / 2 + 'px'; gan.style.width = pw + 'px'; gan.style.top = lineY - U * 7 + 'px';
    const hx = Math.sin(τ * 11) * kw * 0.3;
    const head = $('phead'); head.style.left = hx + 'px'; head.style.top = lineY - U * 7.6 + 'px';
    const ln = $('pline'); ln.style.left = -kw * 0.34 + 'px'; ln.style.width = kw * 0.68 + 'px'; ln.style.top = lineY - U * 0.3 + 'px'; ln.style.opacity = build > 0 && build < 1 ? 1 : 0;
    const st = $('pstatus'); st.style.left = -pw / 2 + 'px'; st.style.top = ph * 0.38 + U * 4 + 'px'; st.textContent = build > 0 ? `PRINTING · LAYER ${String(Math.floor(build * 480)).padStart(3, '0')}` : 'QUEUED'; st.style.opacity = on;
    pr.style.opacity = seg(τ, 0.2, 0.6);
  }

  if (inShot(t, 's7a')) {
    const { τ, D } = local(t, 's7a');
    const cutAt = D - 0.95;
    if (τ < cutAt) {
      fillBg('#07100f', '#030607');
      show(['chain']);
      const ch = S.chain; setCenter(ch, W / 2, H / 2, '', 1);
      const nodes = [...ch.children];
      const step = Math.min(0.44, (cutAt - 0.2) / 5);
      nodes.forEach((n, i) => { const p = seg(τ, i * step, i * step + 0.25); n.style.opacity = p; n.style.transform = `scale(${0.8 + eback(p) * 0.2})`; });
      // light line through the nodes
      const rects = nodes.map((n) => n.getBoundingClientRect());
      ctx.lineWidth = U * 0.5; ctx.strokeStyle = '#5eead4'; ctx.shadowColor = '#5eead4'; ctx.shadowBlur = U * 3;
      for (let i = 0; i < 4; i++) {
        const p = seg(τ, i * step + 0.15, (i + 1) * step + 0.05); if (p <= 0) continue;
        const a = rects[i], b = rects[i + 1];
        const x1 = V ? a.left + a.width / 2 : a.right, y1 = V ? a.bottom : a.top + a.height / 2, x2 = V ? b.left + b.width / 2 : b.left, y2 = V ? b.top : b.top + b.height / 2;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(lerp(x1, x2, p), lerp(y1, y2, p)); ctx.stroke();
      }
      ctx.shadowBlur = 0;
    } else {
      const p = seg(τ, cutAt, D);
      fillBg('#1a1e22', '#0c0f12');
      shelves(t, 11, 1.3, true, { z: 1 + p * 0.6, x: 0, y: 0, f: V ? 42 : 60 });
      ctx.fillStyle = 'rgba(6,10,12,.45)'; ctx.fillRect(0, 0, W, H);
      show(['noover']); setCenter(S.noover, W / 2, H * 0.45, `scale(${0.92 + eout(seg(p, 0, 0.3)) * 0.08})`, seg(p, 0, 0.2));
    }
  }

  if (inShot(t, 's7b')) {
    const { τ, D } = local(t, 's7b');
    fillBg('#ffffff', '#e4e7ee');
    const g = ctx.createRadialGradient(W / 2, H * 0.4, 0, W / 2, H * 0.4, U * 80); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(228,231,238,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    show(['endFig', 'ped', 'endLogo', 'tag']);
    const lp = eout(seg(τ, 0, 0.8));
    const figX = V ? W / 2 : W * 0.28, figY = V ? H * 0.3 : H * 0.44, fs = U * (V ? 40 : 42);
    place(S.ped, figX, figY + fs * 0.47, fs * 0.9, fs * 0.16);
    place(S.endFig, figX, figY, fs, fs * 1.03, `translateY(${(1 - lp) * U * 4}px)`); S.endFig.style.opacity = lp;
    const lx = V ? W / 2 : W * 0.64;
    setCenter(S.endLogo, lx, V ? H * 0.56 : H * 0.36, `scale(${0.94 + lp * 0.06})`, lp);
    setCenter(S.tag, lx, V ? H * 0.7 : H * 0.6, '', seg(τ, 0.8, 1.2));
    S.tag.lastChild.style.opacity = seg(τ, 1.3, 1.7);
    $('vignette').style.opacity = 0.12;
  }

  // film grain over everything; the tiny handheld offset for shot 2
  const stage = $('stage'); stage.style.transform = `translate(${shake[0]}px,${shake[1]}px)`;
  const gr = $('grain'); gr.style.transform = `scale(${1 + rnd(Math.floor(t * 24)) * 0.1}) translate(${rnd(Math.floor(t * 24) + 1) * 3}%,${rnd(Math.floor(t * 24) + 2) * 3}%)`;
};
size(); build();
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map((i) => i.complete ? 1 : new Promise((r) => { i.onload = i.onerror = r; }))));
</script>
</body>
</html>
